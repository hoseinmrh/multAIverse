name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/multiverse-ci.db
      NARRATIVE_PROVIDER: mock
      UV_CACHE_DIR: ${{ github.workspace }}/backend/.uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests migrations ../scripts

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check app tests migrations ../scripts

      - name: Type-check
        working-directory: backend
        run: uv run mypy app tests ../scripts

      - name: Test
        working-directory: backend
        run: uv run pytest

      - name: Verify migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Compile backend
        working-directory: backend
        run: uv run python -m compileall -q app migrations ../scripts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Check formatting
        run: pnpm --dir frontend format:check

      - name: Type-check
        run: pnpm --dir frontend typecheck

      - name: Test
        run: pnpm --dir frontend test

      - name: Build
        run: pnpm --dir frontend build
